name: site

# Site do Snow no GitHub Pages (https://acnaell.github.io/Snow-Apps/)
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/screenshots/**', 'assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir -p _site/assets
          cp site/* _site/
          cp -r docs/screenshots _site/screenshots
          cp assets/snow-icon.svg assets/snow-icon-512.png _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
